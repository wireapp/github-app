name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Lint
        run: |
          ./gradlew ktlintCheck
      - name: Detekt
        run: |
          ./gradlew detekt
      - name: Build
        run: |
          ./gradlew build --info
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  notify-wire-staging:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Send test notification to Wire
        uses: ./.github/actions/notify-wire
        with:
          webhook-url: ${{ secrets.WIRE_WEBHOOK_URL }}
          token: ${{ secrets.WIRE_ACTIONS_TOKEN }}
          text: |
            ✅ notify-wire staging test
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
