name: Notify Wire
description: Send a custom message to a Wire conversation through github-app
inputs:
  webhook-url:
    description: Full github-app Actions endpoint URL for the Wire conversation
    required: true
  secret:
    description: Conversation secret configured for github-app
    required: true
  text:
    description: Message text to send
    required: true
runs:
  using: composite
  steps:
    - name: Send message to Wire
      shell: bash
      env:
        WIRE_WEBHOOK_URL: ${{ inputs.webhook-url }}
        CONVERSATION_SECRET: ${{ inputs.secret }}
        MESSAGE_TEXT: ${{ inputs.text }}
      run: |
        set -euo pipefail
        python3 -c 'import json, os; print(json.dumps({"text": os.environ["MESSAGE_TEXT"]}))' \
          | curl --fail-with-body --silent --show-error \
            -X POST "$WIRE_WEBHOOK_URL" \
            -H "Authorization: Bearer ${CONVERSATION_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @-
