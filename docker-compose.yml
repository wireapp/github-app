services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github
    environment:
      - GHAPP_API_HOST=${GHAPP_API_HOST}
      - GHAPP_SERVER_PORT=${GHAPP_SERVER_PORT}
      - GHAPP_REDIS_URL=${GHAPP_REDIS_URL}
      - WIRE_SDK_API_HOST=${WIRE_SDK_API_HOST}
      - WIRE_SDK_API_TOKEN=${WIRE_SDK_API_TOKEN}
      - WIRE_SDK_APP_ID=${WIRE_SDK_APP_ID}
      - WIRE_SDK_CRYPTOGRAPHY_STORAGE_PASSWORD=${WIRE_SDK_CRYPTOGRAPHY_STORAGE_PASSWORD}
    ports:
      - "${GHAPP_SERVER_PORT:-8083}:${GHAPP_SERVER_PORT:-8083}"
    volumes:
        - github-app:/app
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: github_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: sh -c "redis-server --save 60 1 --loglevel warning --appendonly yes"

volumes:
  redis-data:
  github-app:
